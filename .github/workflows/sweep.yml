# The factory sweep and chain (#108; ADR-0002, area 2, "The factory sweep, built (#108)"): each run
# dispatches at most ONE factory run (factory.yml): a fix round on a factory PR the reviewer sent
# back (#588, "Fix rounds (#588)"), or else one eligible issue, so a queue drains one factory run at
# a time without the admin starting each one.
#
# Triggers: every hour (minute 23, UTC; the hour doesn't matter, so no DST to handle), the
# factory's own runs finishing (`workflow_run`, the chain; a cancelled factory run is ignored), and
# `workflow_dispatch` for the admin: `gh workflow run sweep.yml --repo sssoto17/sunny-pastures`.
# The hourly run is the loop for now: a factory run this sweep's GITHUB_TOKEN dispatched didn't
# start a `workflow_run` sweep when it finished (run 45075597193 on 22 Nov: no sweep after it;
# #582), as GitHub's rule that GITHUB_TOKEN events start no new runs, `workflow_dispatch` and
# `repository_dispatch` excepted, reads. The trigger stays for a dispatch with another token.
# Concurrency group `factory-sweep`: two sweeps never overlap; a newer pending sweep replaces an
# older pending one (GitHub's rule), which loses nothing, since each reads the board afresh.
#
# Jobs, each skipped unless the one before says go:
# - switch: the kill switch (#106), exactly as factory-switch.yml's header shows. Anything but
#   FACTORY_ENABLED=true and nothing is read or dispatched.
# - skipped: with the switch off, or after a cancelled factory run, writes the job summary that
#   says so. No permissions.
# - select: environment `board` (main only), for BOARD_PROJECT_TOKEN, which reads the Project's
#   Priority (REST, on the Project's calls only, as board.yml's `move` does); the read-only
#   GITHUB_TOKEN reads the factory's runs, the issues carrying a factory:* label (with the open
#   native blockers of the factory:ready ones), PRs (with the commits and the reviewer's reviews of
#   the App's PRs, and the App's closed PRs) and branches. factory-sweep-gather.sh reads, then
#   factory-sweep.mjs decides, logs one LABELS line per label move and one SWEEP line, and writes
#   the job summary: the switch, the open factory PRs against the cap, the uncounted lane PRs, the
#   eligible issues in order, the skipped ones and why, the label moves, and the one dispatched or why none. First the
#   reconcile (#619, the header of factory-sweep.mjs): a closed issue loses its factory:* labels,
#   several keep the most advanced, factory:working with no live run and factory:review with no
#   open PR move on. It dispatches nothing while a factory run is queued, waiting or in progress.
#   Next comes a fix round (#588): a factory PR whose reviewer's newest verdict on its head asks for
#   fixes, at most 2 rounds a PR and never twice on one head; the cap doesn't hold it back. It
#   dispatches no new issue while the open factory PRs (drafts included) reach the repo
#   variable FACTORY_MAX_OPEN_PRS (default 4 when unset; admin, 22 Nov 2026): opened by
#   sunny-factory[bot] with a commit its bot user authored. Lane PRs, opened by the App with their
#   own commits, aren't counted (#657); the SWEEP line and the summary show both. An eligible
#   issue is open, at factory:ready, opened by the owner or a collaborator, with no blocked:* label,
#   no open native blocker and no PR or branch yet; Status, Mode and Track aren't read (admin, 23
#   Nov 2026, #619).
# - labels: environment `factory` (main only), for the App's key: the App's token, minted with
#   issues: write and nothing else, writes each label move through factory-label.sh (the reconcile,
#   and factory:working on the issue it dispatches, a fix round's too) before the dispatch, so the
#   factory's gate sees factory:working. Each move happens only while the issue still carries a
#   label select read (FROM), so an admin's relabel since isn't overwritten. GITHUB_TOKEN only
#   checks out the scripts. A failed write
#   fails the job, and nothing is dispatched.
# - dispatch: `actions: write` on this job only, and nothing else: GITHUB_TOKEN dispatches
#   factory.yml on main with the one issue (or the fix round's `pr` and `head`), then waits until
#   the new run is listed, so a sweep
#   queued behind this one sees it. A workflow_dispatch is one of the two events a
#   GITHUB_TOKEN may start a run with ("Triggering a workflow from a workflow",
#   https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow).
#   The run's actor is github-actions[bot], which factory.yml's claude-code-action step names in
#   allowed_bots (#582). The factory's own switch and gate check the issue again. A dispatch that
#   fails leaves the issue at factory:working with no run: the next sweep's reconcile moves it to
#   factory:failed ("run vanished").
# Every event runs the default branch's copy of this file. Event values reach the shell only
# through env:. Actions are GitHub-owned and pinned to a full SHA, main's pins (ADR-0002, area 8).
name: sweep

on:
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: [factory]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: factory-sweep
  cancel-in-progress: false

jobs:
  switch:
    uses: ./.github/workflows/factory-switch.yml
    permissions:
      contents: read

  skipped:
    needs: switch
    if: >-
      needs.switch.outputs.run != 'true' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Say why nothing was read
        env:
          RUN: ${{ needs.switch.outputs.run }}
        run: |
          if [[ $RUN != true ]]; then why="switch off: FACTORY_ENABLED isn't true"; else why="the factory run was cancelled: the chain doesn't act on it"; fi
          echo "SWEEP none: $why"
          printf '### Factory sweep\n\n- Switch: %s\n\nDispatched: none (%s)\n' "$([[ $RUN == true ]] && echo on || echo off)" "$why" >>"$GITHUB_STEP_SUMMARY"

  select:
    needs: switch
    if: >-
      needs.switch.outputs.run == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: board
    permissions:
      actions: read # the factory workflow's runs
      contents: read # main's checkout of the scripts, and the branches
      issues: read # the issues carrying a factory:* label, and their blockers
      pull-requests: read # the open PRs
    outputs:
      issue: ${{ steps.decide.outputs.issue }}
      pr: ${{ steps.decide.outputs.pr }}
      head: ${{ steps.decide.outputs.head }}
      labels: ${{ steps.decide.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            scripts/lib

      - name: Read the runs, labelled issues, PRs, branches and board
        env:
          FACTORY_ENABLED: ${{ vars.FACTORY_ENABLED }}
          GH_TOKEN: ${{ github.token }}
          PROJECT_GH_TOKEN: ${{ secrets.BOARD_PROJECT_TOKEN }}
          SWEEP_DIR: ${{ runner.temp }}/sweep
        run: bash .github/scripts/factory-sweep-gather.sh

      - id: decide
        name: Choose at most one fix round or issue
        env:
          FACTORY_ENABLED: ${{ vars.FACTORY_ENABLED }}
          FACTORY_MAX_OPEN_PRS: ${{ vars.FACTORY_MAX_OPEN_PRS }}
          SWEEP_DIR: ${{ runner.temp }}/sweep
        run: node .github/scripts/factory-sweep.mjs

  labels:
    needs: select
    if: needs.select.outputs.labels != '' && needs.select.outputs.labels != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: factory
    permissions:
      contents: read # main's checkout of the scripts; every write goes through the App's token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Write the label moves as sunny-factory
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LABELS: ${{ needs.select.outputs.labels }}
        run: |
          set -euo pipefail
          jq -e 'type == "array"' <<<"$LABELS" >/dev/null
          mapfile -t moves < <(jq -c '.[]' <<<"$LABELS")
          for m in "${moves[@]}"; do
            # FROM: the labels select read, so a label the admin changed since is left alone.
            ISSUE=$(jq -r '.issue' <<<"$m") TO=$(jq -r '.to // "none"' <<<"$m") WHY=$(jq -r '.why' <<<"$m") \
              FROM=$(jq -r '.from' <<<"$m") bash .github/scripts/factory-label.sh
          done

  dispatch:
    needs: [select, labels]
    # The labels job is skipped when there is no move (a fix round whose PR's branch names no issue).
    if: >-
      always() && needs.select.result == 'success' &&
      (needs.labels.result == 'success' || needs.labels.result == 'skipped') &&
      (needs.select.outputs.issue != '' || needs.select.outputs.pr != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      actions: write # workflow_dispatch of factory.yml (and reading its runs back), nothing else
    steps:
      - name: Dispatch the factory
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.select.outputs.issue }}
          PR: ${{ needs.select.outputs.pr }}
          HEAD: ${{ needs.select.outputs.head }}
        run: |
          set -euo pipefail
          if [[ -n $PR ]]; then
            [[ $PR =~ ^[1-9][0-9]{0,6}$ && $HEAD =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a PR number and head SHA"; exit 1; }
            inputs=(-f "inputs[pr]=$PR" -f "inputs[head]=$HEAD")
            title="factory fix #$PR at $HEAD" # factory.yml's run-name
          else
            [[ $ISSUE =~ ^[1-9][0-9]{0,6}$ ]] || { echo "::error::not an issue number"; exit 1; }
            inputs=(-f "inputs[issue]=$ISSUE")
            title="factory #$ISSUE"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/factory.yml/dispatches" \
            -f ref=main "${inputs[@]}" --silent
          echo "SWEEP dispatched $title"
          echo "Dispatched $title on main." >>"$GITHUB_STEP_SUMMARY"
          # The dispatch API answers before the run is listed. A sweep queued behind this one starts
          # when it ends, so it waits (up to 2 minutes) until the run shows: the next sweep then sees
          # it and stays strictly serial. A run that never shows is a warning, not a failure.
          for _ in $(seq 24); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/factory.yml/runs?per_page=10" \
              --jq "[.workflow_runs[] | select(.display_title == \"$title\" and .status != \"completed\")] | length")
            if ((n > 0)); then echo "SWEEP $title is listed"; exit 0; fi
            sleep 5
          done
          echo "::warning title=sweep::$title wasn't listed within 2 minutes; the next sweep may not see it"
