# `guard / code-owned` (#337, #565): a held PR (one whose diff touches a path in `main`'s
# .github/CODEOWNERS, or one that has ever carried `review:admin`) fails until the admin signs off
# by removing `review:admin` on its current head. The rules are in code-owned-guard.mjs; the design
# is ADR-0002, area 2, "Solo-admin approvals: removing `review:admin` is the sign-off" (#495).
# `guard / code-owned` is a required check; this job, `code-owned (run)`, isn't: the script writes
# the required check run itself, through the Checks API, so each head has one writer and a
# cancelled or older run can't stand as the head's result. Its own workflow, so a label change
# re-runs this check only. Actions are GitHub-owned and pinned to a full SHA (ADR-0002, area 8).
name: code-owned

# `pull_request_target` only (#565): the verdict depends on the label, the sign-off record and the
# diff, never on reviews, so there is no `pull_request_review` trigger. This event always runs the
# default branch's copy of this file and checks out the default branch (ADR-0002, area 2, "Stacks",
# #404), so a PR can't change the workflow, script or CODEOWNERS that judge it, and the sign-off
# record this run writes can be told from one a workflow on the PR's branch writes. `unlabeled` is
# the admin's sign-off; `synchronize` re-arms it; `labeled` and the rest re-read the state.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

# Runs go one at a time per PR, and none is cancelled while it runs: a newer pending run replaces an
# older pending one, so the last run reads the final state. The script re-reads the live state each
# time, and only it writes `guard / code-owned`, so a replaced run leaves nothing behind.
concurrency:
  group: code-owned-${{ github.event.pull_request.number }}

# The job has no `if:` (#379): a skipped required check reads as passing (ADR-0002, #312). It is
# named neither `guard / code-owned` nor `code-owned / sign-off`, the two check runs it writes.
jobs:
  code-owned:
    name: code-owned (run)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The token stays in env, never in a `run:` expression.
    permissions:
      contents: read # main's checkout of .github/scripts and CODEOWNERS
      pull-requests: write # the PR, its files, and adding `review:admin` with its comment
      issues: read # the PR's events: who added or removed `review:admin`
      checks: write # `guard / code-owned` and the `code-owned / sign-off` record
      actions: read # the workflow run behind each record, to count only main's
    steps:
      # The default branch's commit, which `pull_request_target` checks out: never the PR's code.
      # Cone mode keeps .github/CODEOWNERS, a file in a parent folder of the sparse path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - run: node .github/scripts/code-owned-guard.mjs --codeowners .github/CODEOWNERS
        env:
          GITHUB_TOKEN: ${{ github.token }}
