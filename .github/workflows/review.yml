# The reviewer App, sunny-reviewer (ADR-0002, area 2; #68). It reviews every non-draft PR to main,
# and every part of a native stack whatever its base (#404), by REVIEW.md and posts as
# sunny-reviewer[bot]: Required findings become line comments plus Request changes, Optional and
# Nit go in the review's summary, and a clean PR gets Approve, escalated or not (#566). A PR that
# meets a CONSTRAINTS.md escalation row gets review:admin and a plain `escalated:` comment; the
# label and `guard / code-owned` hold it for the admin, never a withheld approval.
#
# Why pull_request_target: the run takes this file and its checkout from main, so a PR can't
# change how it is reviewed. On github.com that holds whatever the PR's base: GitHub's docs give
# GITHUB_REF "Default branch" and GITHUB_SHA "Last commit on default branch" for this event, and
# "the workflow, and any subsequent actions/checkout call that does not specify a ref, is taken
# from the base repository's default branch" (events-that-trigger-workflows.md,
# pull_request_target; securely-using-pull_request_target.md). A stacked part's base branch never
# supplies this file. That hands this job secrets on a PR, so (docs/security.md of the action,
# "Using this action with pull_request_target"):
# - nothing from the PR is checked out or run: the checkout has no `ref` (main), and the PR's
#   diff and text reach Claude as files of data in $RUNNER_TEMP/review-context;
# - Claude gets Read, Grep and Glob only (no Bash, no writes, no Skill tool, no MCP servers) and
#   the repo's GITHUB_TOKEN, read-only. It answers with a JSON verdict (--json-schema);
# - its prompt runs the code-review-and-quality skill, copied from main's checkout into
#   ~/.claude/skills. `--setting-sources user` keeps the repo's .claude/settings.json (hooks, allow
#   rules) and .mcp.json unloaded: the action sets enableAllProjectMcpServers, so the project
#   source would start the repo's MCP servers;
# - two jobs, two runners (#454): `review` runs Claude in the `claude-seat` environment, which
#   holds only CLAUDE_CODE_OAUTH_TOKEN, with the read-only GITHUB_TOKEN; it never mints or holds
#   the App's key. `post`, on a fresh runner that never ran the model, enters `review`, which holds
#   only REVIEWER_APP_PRIVATE_KEY. The hand-off is `review`'s job outputs (the verdict, the head,
#   the base the gate read and the base the action restored), which `post` checks before it mints
#   the App's token (post-review.sh --check). Then only its last step, plain bash
#   (.github/scripts/post-review.sh), writes to GitHub with that token. That script, not the
#   model, decides the review's event.
# On this event the run's ref is main whatever the PR's base, so each job gets its environment's
# secrets on every PR (#227); neither enters `factory`, which holds the factory's key.
# Once per head (#274, #404): the gate in `gather` skips, before Claude runs, a head this App has
# already reviewed or that the admin or this App approved, except review:admin on the PR while its
# approval stands; and a PR on another base unless it's a native stack's part whose stack below
# leaves the config the action restores from the base alone (.github/scripts/review-gate.sh).
# Caps: 30 turns and 15 minutes on `review`, 5 minutes on `post`. #103's runs took 26-34 s a job;
# a review reads about six rule files plus one file per touched area. Actions pinned to full SHAs,
# each at least 7 days old.
name: review

on:
  pull_request_target:
    # labeled: adding review:admin after an approval re-runs the review, which then holds it
    # (ADR-0002, test (e)). Other labels are filtered out by the job's `if:`.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    # No `branches:` filter (#404). It matches the PR's base, so `branches: [main]` never ran for a
    # stacked part above part 1 (#312-#314, #402). The gate filters bases instead: a native stack's
    # part is reviewed, a hand-chained PR isn't.

permissions: {}

# Both jobs' (the event's fields only; no secret).
env:
  PR: ${{ github.event.pull_request.number }}
  FACTORY_APP: sunny-factory # the factory App's slug (ADR-0002, "The factory's identity")
  THREADS_QUERY: >-
    query($owner: String!, $name: String!, $pr: Int!) { repository(owner: $owner, name: $name)
    { pullRequest(number: $pr) { reviewThreads(first: 100) { nodes { id isResolved isOutdated
    path line resolvedBy { login } comments(first: 20) { nodes { author { login } body } } } } } } }

jobs:
  review:
    name: review
    # No drafts, no forks' branches, and not Dependabot's PRs (code-owned, so the admin's). Of
    # the labeled events, only review:admin added by someone other than this App: the label the
    # review adds itself starts no second run, so it can't loop.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action != 'labeled' || (github.event.label.name == 'review:admin' &&
      github.event.sender.login != 'sunny-reviewer[bot]'))
    # On the job, not the workflow, so a filtered-out labeled event never cancels a review.
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Its own environment, holding CLAUDE_CODE_OAUTH_TOKEN only (#454; admin, 21 Nov 2026): the
    # App's key lives in `review`, which only `post` enters, so nothing on Claude's runner can
    # reach it. GITHUB_TOKEN is read-only.
    environment: claude-seat
    permissions:
      contents: read # main's checkout, and the action's fetch of the PR's base
      pull-requests: read # the PR, its diff, reviews and threads
      issues: read # the issues the PR links
    # The hand-off to `post`: data, checked there before the App's token exists.
    outputs:
      verdict: ${{ steps.claude.outputs.structured_output }}
      head: ${{ steps.gather.outputs.head }}
      base: ${{ steps.gather.outputs.base }}
      base_sha: ${{ steps.gather.outputs.base_sha }}
      restored: ${{ steps.handoff.outputs.restored }}
    env:
      ANTHROPIC_API_KEY: '' # never an API key: the setup-token is the only credential
    steps:
      # No `ref`: on pull_request_target that is main, never the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Everything Claude reads about the PR, as files. Its text stays in files and jq: nothing
      # the PR wrote is expanded into a script.
      # Once per head (#274): before anything else is fetched, the gate skips a head this App
      # has already reviewed, unless review:admin is on the PR while its approval stands
      # (ADR-0002, test (e)). Later steps run only on `run == 'true'`, so a skip never pays for
      # Claude.
      - id: gather
        name: Gather the PR (read-only token)
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          BOT: sunny-reviewer # the App's slug, as in the job's `if:`
          ADMIN: ${{ github.repository_owner }} # as post-review.sh's ADMIN
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The trigger takes every base (#404), so check the premise the header quotes: this run,
          # and the checkout above, are the default branch's.
          if [[ $GITHUB_REF != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::this run's ref is $GITHUB_REF, not $DEFAULT_BRANCH: nothing reviewed"
            exit 1
          fi
          echo "JOB_START=$(date +%s)" >>"$GITHUB_ENV"
          CTX=$RUNNER_TEMP/review-context # `runner` isn't allowed in a job's env
          echo "CTX=$CTX" >>"$GITHUB_ENV"
          mkdir -p "$CTX"
          r="repos/$GITHUB_REPOSITORY"
          gh api "$r/pulls/$PR" --jq '{number, title, body, author: .user.login, base: .base.ref,
            base_sha: .base.sha, head_sha: .head.sha, stack, labels: [.labels[].name], additions,
            deletions}' >"$CTX/pr.json"
          gh api --paginate "$r/pulls/$PR/reviews?per_page=100" --jq '.[] | {id,
            author: .user.login, state, submitted_at, body, commit_id}' | jq -s . >"$CTX/reviews.json"
          # A stacked part's base: the paths its stack below changes since the default branch. By
          # SHA, never the name: `gh api` cuts a path at `#`, so `main#x` would compare main (#468).
          base=$(jq -r .base "$CTX/pr.json")
          base_sha=$(jq -er '.base_sha | select(test("^[0-9a-f]{40}$"))' "$CTX/pr.json")
          if [[ $base != "$DEFAULT_BRANCH" ]]; then
            gh api "$r/compare/$DEFAULT_BRANCH...$base_sha" --jq '[.files[]? | .filename,
              (.previous_filename // empty)]' >"$CTX/base-files.json"
          fi
          echo "base=$base" >>"$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >>"$GITHUB_OUTPUT"
          PR_JSON=$CTX/pr.json REVIEWS=$CTX/reviews.json BASE_FILES=$CTX/base-files.json \
            bash .github/scripts/review-gate.sh
          if grep -qx 'run=false' "$GITHUB_OUTPUT"; then exit 0; fi

          gh api --paginate "$r/pulls/$PR/files?per_page=100" --jq '.[] | {filename, status,
            additions, deletions, previous_filename}' | jq -s . >"$CTX/files.json"
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" >"$CTX/diff.patch"
          gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" \
            -F pr="$PR" -f query="$THREADS_QUERY" \
            --jq '.data.repository.pullRequest.reviewThreads.nodes' >"$CTX/threads.json"
          jq -r '.body // ""' "$CTX/pr.json" | grep -oiE '(closes|part of) #[0-9]+' |
            grep -oE '[0-9]+' | sort -u | head -n 5 >"$RUNNER_TEMP/issues" || true
          while read -r n; do
            gh api "repos/$GITHUB_REPOSITORY/issues/$n" --jq '{number, title, body, state,
              labels: [.labels[].name]}' >"$CTX/issue-$n.json" || echo "issue #$n unreadable"
          done <"$RUNNER_TEMP/issues"
          echo "schema=$(jq -c . .github/review-verdict.schema.json)" >>"$GITHUB_OUTPUT"
          echo "head=$(jq -r .head_sha "$CTX/pr.json")" >>"$GITHUB_OUTPUT"

      # The review skill (#68, admin 18 Nov 2026), from main's checkout, into the only skills folder
      # `--setting-sources user` registers (header; ADR-0002, area 2). No `if:` on the gate:
      # copying is free when Claude doesn't run.
      - name: Install the review skill (main's copy)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.claude/skills"
          # -L: the repo's entry is a link into .agents/skills/, which would dangle under $HOME.
          cp -RL .claude/skills/code-review-and-quality "$HOME/.claude/skills/code-review-and-quality"

      - id: claude
        if: steps.gather.outputs.run == 'true'
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }} # read-only; the App's token doesn't exist yet
          allowed_bots: ${{ env.FACTORY_APP }} # its pushes start this run too (#37)
          # A leading /name runs that skill; the rest of the line reaches it as its arguments. The
          # CLI expands a typed skill itself, so `Skill` stays denied below: the model can't load
          # another one.
          prompt: >-
            /code-review-and-quality Read .github/review-prompt.md and follow it. Review PR #${{ github.event.pull_request.number }}.
            The context folder is ${{ runner.temp }}/review-context.
          claude_args: >-
            --max-turns 30
            --setting-sources user
            --add-dir ${{ runner.temp }}/review-context
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch,Task,Skill,Read(//proc/**)"
            --json-schema '${{ steps.gather.outputs.schema }}'

      # The base the action restored config from (#404): claude-code-action fetched origin/<base>
      # on this runner, so only this runner can read it, and `post`'s race check compares it with
      # the commit the gate read. Plain git, after Claude: Claude has no Bash, so it can't move it.
      - id: handoff
        name: Record the base the action restored
        if: steps.claude.outputs.structured_output != ''
        env:
          BASE: ${{ steps.gather.outputs.base }}
        run: |
          set -euo pipefail
          restored=$(git rev-parse --verify --quiet "refs/remotes/origin/$BASE^{commit}") || restored=none
          echo "restored=$restored" >>"$GITHUB_OUTPUT"

      # Report data (ADR-0002, "Caps"): cost, turns and the job's seconds. Non-secret fields only.
      # Then the proof that the skill's text reached the model (#381): registered=true only says
      # the CLI listed it. The expanded skill is in the session's transcript, not the execution
      # file, so the script reads ~/.claude/projects (header of .github/scripts/skill-proof.mjs).
      # Both are on this runner, so the proof runs here, in Claude's job. No proof fails this step
      # with an ::error:: annotation; `post` still posts the verdict (its `if:` has !cancelled()).
      - name: Report
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          GATE: ${{ steps.gather.outputs.run }}
        run: |
          echo "RESULT job_seconds=$(($(date +%s) - ${JOB_START:-$(date +%s)})) reviewed=${GATE:-unknown}"
          [ "$GATE" != false ] || { echo "RESULT skipped: the gate's GATE line says why"; exit 0; }
          f=${EXEC_FILE:-$RUNNER_TEMP/claude-execution-output.json}
          if [ ! -f "$f" ]; then
            echo "RESULT execution_file=missing"
            # Claude was due to run and left no record, so nothing proves the skill reached it.
            [ "$GATE" != true ] || { echo "::error title=Review skill not loaded::no execution file (#381)"; exit 1; }
            exit 0
          fi
          # The proof first, so a malformed file still gets its annotation; its exit code last, so
          # the cost line prints either way.
          proof=0
          node .github/scripts/skill-proof.mjs "$f" "$HOME/.claude/projects" \
            code-review-and-quality '# Code Review and Quality' || proof=$?
          jq -r '.[] | select(.type == "result") | "RESULT subtype=\(.subtype) is_error=\(.is_error)"
            + " num_turns=\(.num_turns) total_cost_usd=\(.total_cost_usd) duration_ms=\(.duration_ms)"' "$f" || true
          exit "$proof"

  # Posts the verdict as sunny-reviewer, on a fresh runner that never ran the model (#454). The only
  # job that enters `review`, which holds REVIEWER_APP_PRIVATE_KEY only, and the only one that
  # mints the App's token, after the hand-off has passed its check. !cancelled(): a failed skill
  # proof in `review` still posts; a cancelled run (a newer one for the PR) never does.
  post:
    name: post
    needs: review
    # `review`'s own concurrency cancels that job, not the run, so its result is read as well: a
    # verdict set before the cancel landed must not post.
    if: ${{ !cancelled() && needs.review.result != 'cancelled' && needs.review.outputs.verdict != '' }}
    # Its own group, never cancelled: an older run's post never cancels a newer run's review, and
    # a post that started finishes its review. post-review.sh posts nothing once the head moved.
    concurrency:
      group: review-post-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: review
    # GITHUB_TOKEN for the checkout and the PR's file list only; every write goes through the
    # App's token.
    permissions:
      contents: read # main's checkout
      pull-requests: read # the PR's files, for the rows from paths
    env:
      ADMIN: ${{ github.repository_owner }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }} # no auto-merge off it (#404)
      # The hand-off, data from the runner that ran the model. post-review.sh checks every field:
      # the verdict's whole shape and no credential in it, the head a commit SHA and still the
      # PR's head, and for a stacked part the base's commit as the gate read it and as the action
      # restored it, the same 40-hex SHA (#404).
      VERDICT: ${{ needs.review.outputs.verdict }}
      HEAD: ${{ needs.review.outputs.head }}
      BASE: ${{ needs.review.outputs.base }}
      BASE_SHA: ${{ needs.review.outputs.base_sha }}
      RESTORED: ${{ needs.review.outputs.restored }}
    steps:
      # No `ref`: on pull_request_target that is main, never the PR head. Fresh: no model ran on
      # this runner, so its scripts and CODEOWNERS are main's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      # Before any token with a write exists. The file list is read again here with the read-only
      # token, not handed off, so the rows from paths never rest on the model's runner.
      - id: check
        name: Check the hand-off (read-only token)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ $GITHUB_REF != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::this run's ref is $GITHUB_REF, not $DEFAULT_BRANCH: nothing posted"
            exit 1
          fi
          bash .github/scripts/post-review.sh --check
          CTX=$RUNNER_TEMP/review-context
          echo "CTX=$CTX" >>"$GITHUB_ENV"
          mkdir -p "$CTX"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[] |
            {filename, status, additions, deletions, previous_filename}' | jq -s . >"$CTX/files.json"

      # Only what posting needs; contents: write because an App's approval may count only with it
      # (ADR-0002, Q14). No issues, workflows or administration.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The only step that writes. The verdict is data: the script decides the event.
      - name: Post the review as sunny-reviewer
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}
        run: bash .github/scripts/post-review.sh
