# Throwaway stub for #358's cancel-in-progress test (test-358/*, never merged).
name: pr-body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body:
    name: guard / pr-body
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: The event this run got
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          MERGE: ${{ github.sha }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          echo "probe action=$ACTION before=$BEFORE after=$AFTER head=$HEAD base=$BASE merge=$MERGE sender=$SENDER run=$GITHUB_RUN_ID"
      - run: sleep 45
