# `guard / pr-body` (#270, #512) and `guard / stack-base` (#264, below). pr-body fails when a body
# that says `Part of #N` also links #N with a closing keyword, which closes #N when that earlier part
# merges (retro 2026-11-15, issue B), and when a closing keyword names an issue other than the PR's
# own (the branch's `<N>`) outside an `Also closes #M` line, which closes that issue too (#512).
# It reads the head ref from the event as well as the body. The script and its grammar are in
# pr-body-guard.mjs.
# Its own workflow, not a job in ci.yml: a body or base edit (`edited`) re-runs these two checks
# only, not all of ci. No path filter, so each reports on every PR and can be a required check
# (ADR-0002, area 2). The body is untrusted text: the script reads it from $GITHUB_EVENT_PATH,
# never through an expression in `run:`. Actions are GitHub-owned and pinned to a full SHA (ADR-0002, area 8).
# One run per head (#358; ADR-0002, area 2, "Stacks"): both jobs skip while the PR is a draft
# (the `gate` job reads its live state), and the run comes from `ready_for_review`, as in ci.yml.
name: pr-body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# The backstop (#358, admin decision (c)), as in ci.yml: a newer run for the same PR cancels the
# older one, so two runs never go in parallel. A body edit cancels a run still checking the old
# body, and the newer run judges the new one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # The draft gate (#358; ADR-0002, area 2, "Stacks"): the PR's live draft state, not the
  # payload's. A run whose event was raised while the PR was a draft can start after the ready
  # mark; read from the payload, its jobs would skip, and with cancel-in-progress its skipped checks
  # would replace the ready run's as the head's newest results, which read as passing. On `push`,
  # or when the read fails, `draft` stays empty and every job runs: it fails open toward CI.
  gate:
    name: pr-body / gate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      draft: ${{ steps.draft.outputs.draft }}
    steps:
      - id: draft
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if draft=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .draft); then
            echo "PR #$PR draft: $draft"
          else
            draft=""
            echo "::warning title=draft gate::couldn't read PR #$PR; the jobs run"
          fi
          echo "draft=$draft" >>"$GITHUB_OUTPUT"

  pr-body:
    name: guard / pr-body
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.draft != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # Node's built-in modules only, so nothing is installed: the runner's Node runs it.
      - run: node .github/scripts/pr-body-guard.mjs

  # `guard / stack-base` (#264): a PR based on anything but main fails unless it's part of a native
  # stack, so related PRs are never hand-chained (CONSTRAINTS.md, "Split size"). `edited` covers a
  # base change. It may ask GitHub for the PR again while scripts/stack.sh links the stack, hence
  # the read-only pull-requests scope and the token in env, never in a `run:` expression.
  stack-base:
    name: guard / stack-base
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.draft != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # Run the default branch's script, not the PR's, so a PR can't switch off the checks that
      # judge it (as the floor job does, #99). A sparse checkout leaves other refs' blobs off the
      # runner, so the default branch gets a checkout of its own. The PR's copy runs only while
      # the default branch has none; if it has one that can't be read, the step fails.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          path: .stack-base
          sparse-checkout: .github/scripts
      - name: Take the script from the default branch
        run: |
          dir="$RUNNER_TEMP/stack-guard"
          mkdir -p "$dir"
          listed=$(git -C .stack-base ls-tree HEAD -- .github/scripts/stack-base-guard.mjs) || exit 1
          if [[ -n $listed ]]; then
            cp .stack-base/.github/scripts/stack-base-guard.mjs .stack-base/.github/scripts/diff.mjs "$dir/"
          else
            echo "::warning::the default branch has no stack-base-guard.mjs yet; using this PR's copy"
            cp .github/scripts/stack-base-guard.mjs .github/scripts/diff.mjs "$dir/"
          fi
      - run: node "$RUNNER_TEMP/stack-guard/stack-base-guard.mjs"
        env:
          GITHUB_TOKEN: ${{ github.token }}
