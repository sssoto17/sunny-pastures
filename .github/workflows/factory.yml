# The factory (#107; ADR-0002, area 2, "The factory workflow, built"): one workflow_dispatch run
# takes one issue to an open PR as the App sunny-factory, within a fixed turn and time cap. The
# admin dispatches it, or the sweep does (sweep.yml, #108: one eligible issue at a time);
# workflow_dispatch needs actions: write, which a lane's token lacks. The dispatch is the Ready
# signal (admin, 21 Nov 2026). It always runs main's copy: the `factory` and
# `claude-seat` environments admit only main, so a dispatch on another branch reaches neither.
#
# Each job is skipped unless the one before says go, so a refusal never mints a token or calls
# Claude, and Claude never shares a runner with a write credential:
# - switch: the kill switch (#106), exactly as factory-switch.yml's header shows. Anything but
#   FACTORY_ENABLED=true logs `SWITCH off` and every later job is skipped.
# - gate: .github/scripts/factory-gate.sh, with the read-only GITHUB_TOKEN and no environment. It
#   refuses unless the issue is open, opened by the owner or a collaborator, carries factory:ready
#   (the Mode signal) and has no open PR or <n>- branch yet.
# - factory: claude-code-action runs /implement on the issue with .github/factory-prompt.md, on the
#   setup-token and the read-only GITHUB_TOKEN only. Claude commits locally and writes the branch
#   name, PR body and labels to files; a plain step packs them with a git bundle into the job's
#   output (the hand-off). No App token exists on this runner. It logs Claude's last `FACTORY …`
#   line as `RESULT factory=` (#615), so a run that opens no PR says why.
# - publish: a fresh runner that never ran the model. .github/scripts/factory-publish.sh checks the
#   hand-off (branch name, labels, body, no workflow or acceptance-test paths); only then does it
#   mint the App's token, push the branch and open the PR with scripts/open-pr.sh, so open-pr.yml
#   opens it as sunny-factory[bot].
# - report: total_cost_usd, turns, each job's billed minutes and the PR, whatever happened.
#
# Fix mode (#588; ADR-0002, area 2, "Fix rounds (#588)"): with `pr` and `head` instead of `issue`
# (the sweep sends them when sunny-reviewer[bot] asks for fixes on a factory PR), the same jobs fix
# that PR. gate runs factory-fix-gate.mjs (via factory-gather.sh): an open PR the factory made, still
# at `head`, whose newest verdict on that head asks for fixes with Required findings. factory makes
# the PR's branch at `head` and gives Claude only those findings (fix mode in
# .github/factory-prompt.md); the hand-off may carry a body, labels to add and an `escalated:`
# comment beside the commits. publish checks it (factory-publish.sh with FIX_BRANCH), then with the
# App's token adds the labels, replaces the body, posts the comment and pushes the new commits to
# the same branch, never forced, so the push starts the next review. Its token adds
# `pull-requests: write` for the labels, body and comment, in fix mode only. Same switch,
# environments, read-only GITHUB_TOKEN, turn and time caps and protected paths as an issue run.
#
# Caps (admin, 21 Nov 2026): --max-turns 100 (the max_turns input may only lower it) and
# timeout-minutes 60 on the factory job, its Claude step stopping at 55. --max-turns doesn't count
# Task subagents' turns, so the timeout is the real bound. Concurrency 1: one factory run at a
# time; a newer dispatch waits, and one waiting run is replaced by a newer one (GitHub's rule).
# GITHUB_TOKEN is read-only in every job. Actions pinned to full SHAs, main's pins.
name: factory
# Runs read "factory #<n>", so the sweep (#108) and the admin can find an issue's runs, and a fix
# round "factory fix #<pr> at <head SHA>": the sweep's only record of the rounds it ran (#588). A
# name is display text that no shell reads.
run-name: >-
  ${{ inputs.pr != '' && format('factory fix #{0} at {1}', inputs.pr, inputs.head)
  || format('factory #{0}', inputs.issue) }}

on:
  workflow_dispatch:
    inputs:
      issue:
        description: The issue to work (open, factory:ready, opened by the owner or a collaborator); empty for a fix
        required: false
        type: string
      pr:
        description: Fix mode (#588), instead of issue - the factory PR whose Required findings to fix
        required: false
        type: string
      head:
        description: Fix mode - the PR's head commit SHA the review is on (the run refuses a PR that moved)
        required: false
        type: string
      max_turns:
        description: Claude's turn cap, from 1 to 100 (only ever lower than the default)
        required: false
        default: '100'
        type: string

permissions: {}

concurrency:
  group: factory
  cancel-in-progress: false

env:
  FACTORY_APP: sunny-factory # the App's slug (ADR-0002, "The factory's identity")
  # Its bot user's id (the user id GitHub gives sunny-factory[bot], read from PR #448's author):
  # commits carry it, and publish refuses any other.
  FACTORY_BOT_ID: '355564973'

jobs:
  switch:
    uses: ./.github/workflows/factory-switch.yml
    permissions:
      contents: read

  gate:
    needs: switch
    if: needs.switch.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read # the checkout of .github/scripts, and the branch lookup
      issues: read # the issue, its author and labels
      pull-requests: read # the open PRs, for the duplicate guard
    outputs:
      run: ${{ steps.gate.outputs.run }}
      issue: ${{ steps.gate.outputs.issue }}
      turns: ${{ steps.gate.outputs.turns }}
      pr: ${{ steps.gate.outputs.pr }} # fix mode only, as are branch and head
      branch: ${{ steps.gate.outputs.branch }}
      head: ${{ steps.gate.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - id: gate
        name: Check the issue or the PR (read-only token)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          PR: ${{ inputs.pr }}
          HEAD: ${{ inputs.head }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: bash .github/scripts/factory-gather.sh

  factory:
    needs: [switch, gate]
    if: needs.switch.outputs.run == 'true' && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Its own environment, holding CLAUDE_CODE_OAUTH_TOKEN only: the App's key lives in `factory`,
    # which this job never enters, so nothing on Claude's runner can reach it (admin, 21 Nov 2026).
    environment: claude-seat
    permissions:
      contents: read # main's checkout
      issues: read # the issue and its trusted comments
      pull-requests: read # the gate's duplicate guard, run again
    outputs:
      handoff: ${{ steps.handoff.outputs.handoff }}
      cost: ${{ steps.result.outputs.cost }}
    env:
      ISSUE: ${{ needs.gate.outputs.issue }}
      FIX_PR: ${{ needs.gate.outputs.pr }}
      FIX_BRANCH: ${{ needs.gate.outputs.branch }}
      FIX_HEAD: ${{ needs.gate.outputs.head }}
      OUT: ${{ github.workspace }}/../factory-out
      ANTHROPIC_API_KEY: '' # never an API key: the setup-token is the only credential
    steps:
      # main, with history for the review's merge-base. The action points origin at the
      # read-only GITHUB_TOKEN itself, so the checkout keeps none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # The issue as Claude reads it, as files (the repo is public): the gate runs again on a fresh
      # read, so an issue that changed hands or got a branch since stops here, then its body and
      # only the comments of the owner and collaborators. In fix mode: the gate again, then the
      # PR's title, body, branch and labels and the review's Required findings, and the PR's
      # branch made locally at the head the gate checked, for Claude to switch to.
      - id: context
        name: Gather the issue or the PR (read-only token)
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_TURNS: ${{ needs.gate.outputs.turns }}
          PR: ${{ needs.gate.outputs.pr }}
          HEAD: ${{ needs.gate.outputs.head }}
        run: |
          set -euo pipefail
          if [[ -n $PR ]]; then ISSUE=""; fi
          bash .github/scripts/factory-gather.sh
          grep -qx 'run=true' "$GITHUB_OUTPUT" || { echo "::error::the issue or PR no longer passes the gate"; exit 1; }
          ctx=$RUNNER_TEMP/factory-context
          mkdir -p "$ctx" "$OUT"
          if [[ -n $PR ]]; then
            g=$RUNNER_TEMP/factory-gate
            jq '{number, title, body, branch: .head.ref, labels: [.labels[].name]}' "$g/pr.json" >"$ctx/pr.json"
            cp "$g/findings.md" "$ctx/findings.md"
            git fetch -q --no-tags origin "refs/heads/$FIX_BRANCH"
            [[ $(git rev-parse FETCH_HEAD) == "$FIX_HEAD" ]] || { echo "::error::PR #$PR moved since the gate"; exit 1; }
            git branch "$FIX_BRANCH" "$FIX_HEAD"
            echo "RESULT fix=#$PR branch=$FIX_BRANCH head=$FIX_HEAD"
            exit 0
          fi
          r="repos/$GITHUB_REPOSITORY/issues/$ISSUE"
          # The copy the gate just checked, so the text Claude reads is the text whose author passed.
          jq '{number, title, body, labels: [.labels[].name]}' "$RUNNER_TEMP/factory-gate/issue.json" >"$ctx/issue.json"
          gh api --paginate "$r/comments?per_page=100" --jq '.[] | select(.author_association
            | IN("OWNER", "MEMBER", "COLLABORATOR")) | {author: .user.login, created_at, body}' |
            jq -s . >"$ctx/comments.json"
          echo "RESULT trusted_comments=$(jq length "$ctx/comments.json")"

      # Bubblewrap for the subprocess env scrub below (#107's live test, 21 Nov 2026): Claude Code
      # 2.1.319 refuses to start with CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 and no bwrap. From
      # Ubuntu's archive, with socat, as the action's own isolation step installs them (action.yml
      # at the pinned SHA, "Install subprocess isolation dependencies", which runs only with
      # allowed_non_write_users). Ubuntu 24.04's AppArmor denies unprivileged user namespaces, so
      # first the narrowest fix: a profile that lets /usr/bin/bwrap alone create them, in the form
      # of Ubuntu's example (ubuntu.com/blog/ubuntu-23-10-restricted-unprivileged-user-namespaces).
      # Only if bwrap still fails, the action's own fix: the sysctl, for this runner. The smoke
      # runs bwrap with a PID namespace, as the scrub does, so a broken install stops here and
      # says why, before Claude starts.
      - name: Install bubblewrap for the env scrub
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends bubblewrap socat && break
            echo "apt-get attempt $i failed, retrying"
            sleep 5
          done
          command -v bwrap >/dev/null || { echo "::error::bubblewrap didn't install"; exit 1; }
          smoke() { bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid true; }
          if [ -d /etc/apparmor.d ]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
              '/usr/bin/bwrap flags=(default_allow) {' '  userns,' '}' |
              sudo tee /etc/apparmor.d/bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap || echo "the bwrap AppArmor profile didn't load"
          fi
          if smoke 2>"$RUNNER_TEMP/bwrap.err"; then
            echo "RESULT bwrap=ok via=apparmor-profile restrict=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo none) $(bwrap --version)"
            exit 0
          fi
          echo "bwrap with the profile: $(head -c 300 "$RUNNER_TEMP/bwrap.err")"
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 ||
              { echo "::error::sysctl failed: AppArmor still restricts user namespaces"; exit 1; }
          fi
          smoke 2>"$RUNNER_TEMP/bwrap.err" || {
            echo "::error::bwrap can't create its namespaces: $(head -c 300 "$RUNNER_TEMP/bwrap.err")"
            exit 1
          }
          echo "RESULT bwrap=ok via=sysctl $(bwrap --version)"

      # No write credential: only the read-only GITHUB_TOKEN, as github_token (the action also
      # hands it to git and its GitHub tools), and subprocesses get a scrubbed environment (the
      # setup-token stays out of Bash's env). Bash still has open network access. A
      # leading /name runs that skill; the rest of the line reaches it as its arguments. The
      # project's settings load: an `ask` rule has no one to ask here, so it denies. That holds in
      # the default permission mode only: since v1.0.273 the action starts a run with a prompt in
      # auto mode, where a safety review decides what no allow rule covers, so the mode is set
      # below (#486; the release's upgrade notes). allowed_bots also turns that default off, but
      # the flag stays explicit. No web tools.
      # allowed_bots names exactly the bot sweep.yml dispatches as: its GITHUB_TOKEN makes the run's
      # actor github-actions[bot], which the action's actor check refuses otherwise (#582, run
      # 45075597193; src/github/validation/actor.ts at the pinned SHA drops the [bot] suffix before
      # comparing). Never '*'. A run the admin dispatches has a human actor, which the list doesn't
      # touch. With allowed_bots set the action keeps the token out of .git/config; nothing here
      # pushes from this runner (docs/security.md at the pinned SHA).
      - id: claude
        timeout-minutes: 55
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          bot_name: ${{ env.FACTORY_APP }}[bot]
          bot_id: ${{ env.FACTORY_BOT_ID }}
          allowed_bots: github-actions # sweep.yml's dispatch (#582)
          # Built from the gate's checked values only (numbers and a <n>-<slug> branch).
          prompt: >-
            ${{ needs.gate.outputs.pr != '' && format('Read .github/factory-prompt.md and follow
            its "Fix mode" section. You are fixing PR #{0} on the branch {1}; its context folder is
            {2}/factory-context; write your hand-off files to {3}.', needs.gate.outputs.pr,
            needs.gate.outputs.branch, runner.temp, env.OUT) || format('/implement #{0} Read
            .github/factory-prompt.md and follow it. The issue is #{0}; its context folder is
            {1}/factory-context; write your hand-off files to {2}.', needs.gate.outputs.issue,
            runner.temp, env.OUT) }}
          claude_args: >-
            --max-turns ${{ needs.gate.outputs.turns }}
            --permission-mode default
            --add-dir ${{ runner.temp }}/factory-context
            --add-dir ${{ env.OUT }}
            --allowedTools "Bash,Edit,Write,MultiEdit,Read,Glob,Grep,Skill,Task,TodoWrite"
            --disallowedTools "WebFetch,WebSearch,Read(//proc/**)"

      # The hand-off: data for publish to check, never trusted here. The bundle holds only the
      # commits past the main this run checked out. In fix mode: the commits past the PR's head
      # (an empty file when there are none), and `comment`; an empty file means "nothing", and a
      # hand-off with nothing in it isn't handed on.
      - id: handoff
        name: Pack the hand-off
        if: steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          if [[ -n $FIX_PR ]]; then
            h=$RUNNER_TEMP/handoff
            mkdir -p "$h"
            printf '%s\n' "$FIX_BRANCH" >"$h/branch"
            for f in pr-body.md labels comment; do
              if [ -f "$OUT/$f" ]; then cp "$OUT/$f" "$h/$f"; else : >"$h/$f"; fi
            done
            n=$(git rev-list --count "$FIX_HEAD..refs/heads/$FIX_BRANCH")
            if ((n > 0)); then
              git bundle create -q "$h/commits.bundle" "$FIX_HEAD..refs/heads/$FIX_BRANCH"
            else
              : >"$h/commits.bundle"
            fi
            if [[ ! -s $h/commits.bundle && ! -s $h/pr-body.md && ! -s $h/comment ]] && ! grep -q '[^[:space:]]' "$h/labels"; then
              echo "RESULT handoff=none: the fix changed nothing"
              exit 0
            fi
            data=$(tar -C "$h" -czf - branch comment commits.bundle labels pr-body.md | base64 -w0)
            ((${#data} < 900000)) || { echo "RESULT handoff=none: ${#data} bytes, over the 900 kB cap"; exit 0; }
            echo "handoff=$data" >>"$GITHUB_OUTPUT"
            echo "RESULT handoff=fix $FIX_BRANCH commits=$n bytes=${#data}"
            exit 0
          fi
          [ -s "$OUT/branch" ] || { echo "RESULT handoff=none: Claude wrote no branch"; exit 0; }
          b=$(head -n1 "$OUT/branch")
          [[ $b =~ ^$ISSUE-[a-z0-9-]+$ ]] || { echo "RESULT handoff=none: bad branch name"; exit 0; }
          h=$RUNNER_TEMP/handoff
          mkdir -p "$h"
          printf '%s\n' "$b" >"$h/branch"
          cp "$OUT/pr-body.md" "$h/pr-body.md"
          if [ -f "$OUT/labels" ]; then cp "$OUT/labels" "$h/labels"; else : >"$h/labels"; fi
          git bundle create -q "$h/commits.bundle" "$GITHUB_SHA..refs/heads/$b"
          data=$(tar -C "$h" -czf - branch commits.bundle labels pr-body.md | base64 -w0)
          ((${#data} < 900000)) || { echo "RESULT handoff=none: ${#data} bytes, over the 900 kB cap"; exit 0; }
          echo "handoff=$data" >>"$GITHUB_OUTPUT"
          echo "RESULT handoff=$b bytes=${#data}"

      - id: result
        name: Claude's result
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -uo pipefail
          f=${EXEC_FILE:-$RUNNER_TEMP/claude-execution-output.json}
          # Whether Claude ran (#582), for the "Claude ran" step below: an execution file, or the
          # prompt file the action writes once its checks pass (src/modes/agent/index.ts at the
          # pinned SHA, after checkHumanActor), before it installs the CLI and starts Claude. The
          # prompt file covers a Claude step that timed out, which writes no execution file; it
          # also counts a CLI install failure as a run, the safe side (the issue waits for an
          # edit). Re-check this path when the pin moves.
          if [ -f "$f" ] || [ -f "$RUNNER_TEMP/claude-prompts/claude-prompt.txt" ]; then
            echo "ran=true" >>"$GITHUB_OUTPUT"
          fi
          [ -f "$f" ] || { echo "RESULT claude=$OUTCOME execution_file=missing"; echo "RESULT factory=none"; exit 0; }
          line=$(jq -r '.[] | select(.type == "result") | "subtype=\(.subtype) is_error=\(.is_error)"
            + " num_turns=\(.num_turns) total_cost_usd=\(.total_cost_usd) duration_ms=\(.duration_ms)"' "$f" | tail -n1)
          echo "RESULT claude=$OUTCOME $line"
          echo "cost=$line" | tr -cd '[:alnum:] =._\n-' >>"$GITHUB_OUTPUT"
          # Why the run ended, in Claude's words (#615): the last line of the final result that
          # starts with `FACTORY ` (ready:, stopped:, fixed:), as .github/factory-prompt.md has
          # Claude end. The model wrote it, so jq makes it one line: it splits on every line break
          # (\r, \n, NEL, U+2028/9), strips control and format characters (\p{Cc}, \p{Cf}: escapes,
          # NUL, bidi overrides) and keeps 300 characters. The line starts with `RESULT `, so no
          # workflow command can run from it. Tests: .github/scripts/tests/factory-gate.test.mjs.
          factory=$(jq -r '[.[] | select(.type == "result")] | last | .result | strings
            | [splits("\r\n|[\n\r\u0085\u2028\u2029]") | select(startswith("FACTORY "))] | last // empty
            | gsub("[\\p{Cc}\\p{Cf}]"; "") | .[:300]' "$f" 2>/dev/null)
          echo "RESULT factory=${factory:-none}"

      # The sweep's evidence (#582): sweep.yml skips an issue whose last run opened no PR only when
      # this step succeeded in it, read by name from the run's jobs (factory-sweep-gather.sh). A
      # run that failed before Claude ran skips it, so the sweep tries the issue again. The step's
      # name is that contract: renaming it means changing factory-sweep-gather.sh too.
      - name: Claude ran
        if: always() && steps.result.outputs.ran == 'true'
        run: echo "RESULT claude_ran=true"

  publish:
    needs: [gate, factory]
    if: needs.factory.outputs.handoff != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: factory
    # GITHUB_TOKEN for the checkout only; every write goes through the App's token.
    permissions:
      contents: read
    outputs:
      pr: ${{ steps.open.outputs.pr || steps.fix.outputs.pr }}
    env:
      ISSUE: ${{ needs.gate.outputs.issue }}
      FIX_PR: ${{ needs.gate.outputs.pr }}
      FIX_BRANCH: ${{ needs.gate.outputs.branch }}
      FIX_HEAD: ${{ needs.gate.outputs.head }}
    steps:
      # main's scripts and history, the base the hand-off is checked against. Fresh: no model ran
      # on this runner, so its git config and hooks are main's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: check
        name: Check the hand-off (no token yet)
        env:
          DATA: ${{ needs.factory.outputs.handoff }}
        run: |
          set -euo pipefail
          printf '%s' "$DATA" | base64 -d >"$RUNNER_TEMP/handoff.tgz"
          mkdir -p "$RUNNER_TEMP/handoff"
          base=$(git rev-parse HEAD)
          if [[ -n $FIX_PR ]]; then
            # The PR's branch as it is now: still the head the gate checked, so the push is a
            # fast-forward of what the reviewer saw.
            git fetch -q --no-tags origin "refs/heads/$FIX_BRANCH"
            base=$(git rev-parse FETCH_HEAD)
            [[ $base == "$FIX_HEAD" ]] || { echo "::error::PR #$FIX_PR moved since the gate"; exit 1; }
          else
            unset FIX_BRANCH
          fi
          HANDOFF=$RUNNER_TEMP/handoff.tgz WORK=$RUNNER_TEMP/handoff BASE=$base \
            BOT="${FACTORY_APP}[bot]" BOT_ID=$FACTORY_BOT_ID bash .github/scripts/factory-publish.sh

      # Only what publishing needs: contents write pushes the branch and sends open-pr's
      # repository_dispatch; pull requests read for open-pr.sh's lookup, write in fix mode only
      # (the PR's labels, body and comment). No workflows.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: ${{ needs.gate.outputs.pr != '' && 'write' || 'read' }}

      - id: open
        name: Push and open the PR as sunny-factory
        if: needs.gate.outputs.pr == ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.check.outputs.branch }}
          LABELS: ${{ steps.check.outputs.labels }}
          BODY: ${{ steps.check.outputs.body }}
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null push --no-verify \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            "refs/heads/$BRANCH:refs/heads/$BRANCH"
          args=()
          IFS=, read -r -a wanted <<<"$LABELS"
          for l in ${wanted[@]+"${wanted[@]}"}; do args+=(--label "$l"); done
          pr=$(scripts/open-pr.sh ${args[@]+"${args[@]}"} "$BRANCH" "$BODY")
          echo "pr=$pr" >>"$GITHUB_OUTPUT"
          echo "RESULT pr=#$pr branch=$BRANCH"

      # Fix mode: labels, body and comment first, so the review the push starts reads them; then
      # the new commits, a plain push that GitHub refuses unless it fast-forwards the branch.
      - id: fix
        name: Fix the PR as sunny-factory
        if: needs.gate.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LABELS: ${{ steps.check.outputs.labels }}
          BODY: ${{ steps.check.outputs.body }}
          COMMENT: ${{ steps.check.outputs.comment }}
          COMMITS: ${{ steps.check.outputs.commits }}
        run: |
          set -euo pipefail
          r="repos/$GITHUB_REPOSITORY"
          args=()
          IFS=, read -r -a wanted <<<"$LABELS"
          for l in ${wanted[@]+"${wanted[@]}"}; do args+=(-f "labels[]=$l"); done
          if ((${#args[@]})); then gh api -X POST "$r/issues/$FIX_PR/labels" "${args[@]}" --silent; fi
          if [[ -n $BODY ]]; then gh api -X PATCH "$r/pulls/$FIX_PR" -F "body=@$BODY" --silent; fi
          if [[ -n $COMMENT ]]; then gh api -X POST "$r/issues/$FIX_PR/comments" -F "body=@$COMMENT" --silent; fi
          if ((COMMITS > 0)); then
            git -c core.hooksPath=/dev/null push --no-verify \
              "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
              "refs/heads/$FIX_BRANCH:refs/heads/$FIX_BRANCH"
          fi
          echo "pr=$FIX_PR" >>"$GITHUB_OUTPUT"
          echo "RESULT fix=#$FIX_PR commits=$COMMITS labels=${LABELS:-none} body=${BODY:+replaced}${BODY:-unchanged} comment=${COMMENT:+posted}${COMMENT:-none}"

  # Report data (ADR-0002, "Caps"): cost and turns, each job's billed minutes (GitHub rounds each
  # job up to a whole minute) and the PR. Non-secret fields only.
  report:
    needs: [switch, gate, factory, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read # this run's jobs and their times
    steps:
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          COST: ${{ needs.factory.outputs.cost }}
          PR: ${{ needs.publish.outputs.pr }}
        run: |
          set -uo pipefail # no -e: every line reports, whatever failed before it
          echo "RESULT claude ${COST:-not run}"
          echo "RESULT pr=${PR:+#}${PR:-none}"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" | jq -r '
            [.jobs[] | select(.started_at != null and .completed_at != null and .conclusion != "skipped")
              | {name, s: ((.completed_at | fromdate) - (.started_at | fromdate))}]
            | (.[] | "RESULT job=\(.name) seconds=\(.s) minutes=\(((.s + 59) / 60) | floor)"),
              "RESULT job_minutes=\((map(((.s + 59) / 60) | floor) | add // 0) + 1) (this report job counted as 1)"' ||
            echo "RESULT job_minutes=unknown: the jobs API failed"
