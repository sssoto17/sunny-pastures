# THROWAWAY (#565, never merge): see .github/throwaway-565-proof3.sh.
name: throwaway-565-proof3
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  proof:
    name: throwaway-565 proof 3
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      statuses: write
      id-token: write
      pull-requests: write
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - run: bash .github/throwaway-565-proof3.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
