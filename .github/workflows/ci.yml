# The checks every PR runs (CONSTRAINTS.md, "Enforced with numbers" and "Floor"; #40).
# Required checks are matched by job name, so each `name:` is exactly the check name in
# ADR-0002, area 2. No path filters: a required check must report on every PR.
# Actions are GitHub-owned and pinned to a full commit SHA at least 7 days old (ADR-0002, area 8).
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: ci / typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    name: ci / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # fallow dupes reports clones in the files changed since the merge base
      - uses: ./.github/actions/setup
      - run: pnpm lint
      # CONSTRAINTS.md, duplication row: 0 new clones in the changed packages/sim files.
      - run: pnpm dupes --changed-since "origin/$BASE_REF"

  test:
    name: ci / test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # CONSTRAINTS.md, Stages: CI runs larger property runs. Local runs leave it unset (100).
      SIM_PROPERTY_RUNS: '1000'
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the coverage gate diffs against the merge base
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: node .github/scripts/coverage-gate.mjs --base "origin/$BASE_REF"

  floor:
    name: guard / floor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the guard diffs against the merge base
      # Node only, from a pinned action: the guard uses only Node and git. A local action such as
      # ./.github/actions/setup is read from the PR's checkout, so a PR could change what runs here
      # before the base branch's guard starts (#99).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Run the base branch's guard, not the PR's, so a PR can't weaken the guard that judges it.
      # The PR's own copy is used only while the base has no guard yet (the PR that adds it).
      - name: Take the guard from the base branch
        run: |
          dir="$RUNNER_TEMP/floor-guard"
          mkdir -p "$dir"
          if git cat-file -e "origin/$BASE_REF:.github/scripts/floor-guard.mjs" 2>/dev/null; then
            for f in floor-guard.mjs diff.mjs; do
              git show "origin/$BASE_REF:.github/scripts/$f" > "$dir/$f"
            done
            echo "Using the floor guard from origin/$BASE_REF"
          else
            cp .github/scripts/floor-guard.mjs .github/scripts/diff.mjs "$dir/"
            echo "::warning::origin/$BASE_REF has no floor guard yet; using this PR's copy"
          fi
      - run: node "$RUNNER_TEMP/floor-guard/floor-guard.mjs" --base "origin/$BASE_REF"
