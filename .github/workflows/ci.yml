# The checks every PR runs (CONSTRAINTS.md, "Enforced with numbers" and "Floor"; #40). The
# security scans (gitleaks, pnpm audit, Semgrep) are in security.yml (#42).
# Required checks are matched by job name, so each `name:` is exactly the check name in
# ADR-0002, area 2. No path filters: a required check must report on every PR.
# Actions are GitHub-owned and pinned to a full commit SHA at least 7 days old (ADR-0002, area 8).
# Stacks (#264; ADR-0002, area 2, "Stacks"): typecheck, lint and test run once per stack, on its
# top part, diffing from the stack's base, so they cover every part below; `ci / stack` says which
# part is the top. Every other job runs on each part. GitHub documents a required job skipped by
# its `if:` as passing; #264's throwaway ruleset checks it here. `push` to main runs the suite on
# exactly what landed, so a partial stack merge that breaks main shows at once.
# One run per head (#358): scripts/open-pr.sh opens a PR as a draft and scripts/stack.sh pushes a
# stack while its parts are drafts, so every job skips while the PR is a draft (a draft can't
# merge, so a skipped check there hides nothing) and the run comes from `ready_for_review`. The
# `gate` job reads the PR's live draft state, never the payload's; on `push` to main it reads
# nothing, and every job runs.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# The backstop (#358, admin decision (c)): a newer run for the same PR cancels the older one, so
# two runs never go in parallel. A `synchronize` run that starts after the ready mark runs in full
# and cancels the ready run, even one raised while the PR was a draft, since `gate` reads the live
# state (ADR-0002, area 2, "Stacks", for the residual).
# `github.sha` keeps each push to main in a group of its own, so nothing on main is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # The draft gate (#358; ADR-0002, area 2, "Stacks"): the PR's live draft state, not the
  # payload's. A run whose event was raised while the PR was a draft can start after the ready
  # mark; read from the payload, its jobs would skip, and with cancel-in-progress its skipped checks
  # would replace the ready run's as the head's newest results, which read as passing. On `push`,
  # or when the read fails, `draft` stays empty and every job runs: it fails open toward CI.
  gate:
    name: ci / gate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      draft: ${{ steps.draft.outputs.draft }}
    steps:
      - id: draft
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if draft=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .draft); then
            echo "PR #$PR draft: $draft"
          else
            draft=""
            echo "::warning title=draft gate::couldn't read PR #$PR; the jobs run"
          fi
          echo "draft=$draft" >>"$GITHUB_OUTPUT"

  # Whether this PR is a stack's lower part. The event can't say so on `opened`, since
  # scripts/stack.sh links the stack after opening the PRs, so the script asks GitHub (read-only
  # token). It writes top=false only for a lower part: if it fails, the jobs below still run.
  stack:
    name: ci / stack
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.draft != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      top: ${{ steps.top.outputs.top }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # Run the default branch's script, not the PR's, so a PR can't switch off the checks that
      # judge it (as the floor job does, #99). A sparse checkout leaves other refs' blobs off the
      # runner, so the default branch gets a checkout of its own. The PR's copy runs only while
      # the default branch has none; if it has one that can't be read, the step fails.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          path: .stack-base
          sparse-checkout: .github/scripts
      - name: Take the script from the default branch
        run: |
          dir="$RUNNER_TEMP/stack-guard"
          mkdir -p "$dir"
          listed=$(git -C .stack-base ls-tree HEAD -- .github/scripts/stack-base-guard.mjs) || exit 1
          if [[ -n $listed ]]; then
            cp .stack-base/.github/scripts/stack-base-guard.mjs .stack-base/.github/scripts/diff.mjs "$dir/"
          else
            echo "::warning::the default branch has no stack-base-guard.mjs yet; using this PR's copy"
            cp .github/scripts/stack-base-guard.mjs .github/scripts/diff.mjs "$dir/"
          fi
      - id: top
        run: node "$RUNNER_TEMP/stack-guard/stack-base-guard.mjs" --top
        env:
          GITHUB_TOKEN: ${{ github.token }}

  typecheck:
    name: ci / typecheck
    needs: [gate, stack]
    # Once per stack: skipped when `ci / stack` said this is a lower part, and on a draft, where
    # `ci / stack` skips too and so leaves `top` empty.
    if: ${{ !cancelled() && needs.gate.outputs.draft != 'true' && needs.stack.outputs.top != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      # #433: Next bundles the sim from its built dist/, and the build must need no database
      # variables (ADR-0007, Q6). No step sets DATABASE_URL, so this checks both, and a client
      # import of src/server/ fails here on `server-only` (CONSTRAINTS.md, "Boundaries: server-only").
      - name: Build the app (sim, then next build)
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm --filter @sunny-pastures/web build

  lint:
    name: ci / lint
    needs: [gate, stack]
    # Once per stack: skipped when `ci / stack` said this is a lower part, and on a draft, where
    # `ci / stack` skips too and so leaves `top` empty.
    if: ${{ !cancelled() && needs.gate.outputs.draft != 'true' && needs.stack.outputs.top != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # What changed: since the stack's base for a PR (every part below the top included; the
      # default branch while GitHub hasn't linked the stack yet), since the commit before a push.
      SINCE: >-
        ${{ github.event_name == 'push' && github.event.before || format('origin/{0}',
        github.event.pull_request.stack.base.ref || github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # fallow audit compares the change with a snapshot of its merge base
      - uses: ./.github/actions/setup
      # CONSTRAINTS.md, the Duplication, Complexity and Dead code rows (#503): `fallow audit` over
      # the whole repo against $SINCE, failing on what this change introduces (`new-only`). CRAP is
      # Fallow's static estimate here, since coverage exists only in `ci / test`. The script renders
      # the annotations and the job summary from the same run; neither needs a write permission.
      # First in the job, so a lint or format failure doesn't hide them (no `if:`, which the floor
      # guard reads as a skipped check).
      - run: pnpm audit:changed --base "$SINCE"
      - run: pnpm lint
      # CONSTRAINTS.md, formatting row.
      - run: pnpm format:check
      # Markdown (#344; ADR-0005, section 6): Prettier's prose wrap, and every top-level table keeps
      # `<!-- prettier-ignore -->` on the line before it. Not in check:fast, for its 5 s budget.
      - run: pnpm format:md
      # CONSTRAINTS.md, migrations row (#372): no applied migration edited since the base, and
      # `drizzle-kit check` plus a generate that writes nothing. No database: the stack is
      # `ci / test`'s (#382), when a change can reach it.
      - run: pnpm db:check "$SINCE"

  test:
    name: ci / test
    needs: [gate, stack]
    # Once per stack: skipped when `ci / stack` said this is a lower part, and on a draft, where
    # `ci / stack` skips too and so leaves `top` empty.
    if: ${{ !cancelled() && needs.gate.outputs.draft != 'true' && needs.stack.outputs.top != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # CONSTRAINTS.md, Stages: CI runs larger property runs. Local runs leave it unset (100).
      SIM_PROPERTY_RUNS: '1000'
      # What changed: since the stack's base for a PR (every part below the top included; the
      # default branch while GitHub hasn't linked the stack yet), since the commit before a push.
      SINCE: >-
        ${{ github.event_name == 'push' && github.event.before || format('origin/{0}',
        github.event.pull_request.stack.base.ref || github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the coverage gate diffs against the merge base
      - uses: ./.github/actions/setup
      # ADR-0007 section 6, "The `db` project" (#382). The `db` project's tests need the Supabase
      # stack, which costs runner time, so a PR starts it only when it changes apps/web/src/server/
      # or supabase/, or what runs the `db` tests: the stack action or vitest.config.mts (admin,
      # 21 Nov, #439 review). Every push to main starts it, so main runs every project and the full
      # coverage gate, ratchet included (admin, 19 Nov), and a drop merged without the stack turns
      # main red.
      # Without the stack only the `unit` and `ui` projects run (`ui` needs no stack; #594), and the
      # gate skips the whole-project ratchet, since the untested store files would read 0% (as
      # `check:task` does). The changed-line floors apply either way.
      # The decision is this step, not a skip in a test.
      - name: Choose the Vitest projects
        id: projects
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            stack=true
            why="a push to main always starts the stack"
          else
            # A base git can't read fails the step: only an empty list means nothing was touched.
            changed=$(git diff --name-only "$SINCE...HEAD" -- apps/web/src/server supabase \
              .github/actions/supabase-stack .github/actions/supabase-cli vitest.config.mts)
            if [[ -n $changed ]]; then
              stack=true
              why="the change touches apps/web/src/server/, supabase/, .github/actions/supabase-stack/, .github/actions/supabase-cli/ or vitest.config.mts"
            else
              stack=false
              why="the change touches none of apps/web/src/server/, supabase/, .github/actions/supabase-stack/, .github/actions/supabase-cli/ or vitest.config.mts"
            fi
          fi
          if [[ $stack == true ]]; then
            summary="Projects unit, ui and db, with the Supabase stack, and the full coverage gate: $why."
          else
            summary="Projects unit and ui only, no stack, and the coverage gate with --skip-ratchet: $why."
          fi
          echo "stack=$stack" >> "$GITHUB_OUTPUT"
          echo "$summary" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Start the Supabase stack
        if: steps.projects.outputs.stack == 'true'
        uses: ./.github/actions/supabase-stack
      - name: Run the tests
        env:
          STACK: ${{ steps.projects.outputs.stack }}
        run: |
          if [[ $STACK == true ]]; then
            pnpm test
          else
            pnpm test --project unit --project ui
          fi
      - name: Check coverage
        env:
          STACK: ${{ steps.projects.outputs.stack }}
        run: |
          if [[ $STACK == true ]]; then
            node .github/scripts/coverage-gate.mjs --base "$SINCE"
          else
            node .github/scripts/coverage-gate.mjs --base "$SINCE" --skip-ratchet
          fi

  # CONSTRAINTS.md, Acceptance row (MUST-15.3, #49): the admin-owned tests/acceptance/** over HTTP,
  # as a black box, against a fresh local Supabase stack on this runner, started by the same
  # composite action as `ci / test`'s db project (#39: no job `container:`, no Postgres `services:`).
  # Its db:env writes ./.env, which `pnpm test:acceptance` (tests/acceptance/run.mjs) reads to build
  # the app, start it, wait on /api/health, run the suite and stop it. No step prints a key, token or
  # URL (docs/agents/sandbox.md, "Secrets in output"). It runs on every part of a stack.
  # Path filter (admin, 22 Nov: don't run CI more than necessary): a step inside the job, not a
  # workflow `paths:` trigger, so the check still reports, as a success, on a PR that touches
  # nothing it covers; a required check that never reports reads "Expected" (ADR-0002, #312).
  # Its measured runner time is in CONSTRAINTS.md, under the Ratchets table.
  acceptance:
    name: ci / acceptance
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.draft != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Since the stack's base, as `ci / test` diffs, so a top part covers every part below it.
      SINCE: >-
        ${{ github.event_name == 'push' && github.event.before || format('origin/{0}',
        github.event.pull_request.stack.base.ref || github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the path filter diffs against the base
      # The app's code, its schema, the tests, the dependencies, the root build config, and what
      # runs this job. Every push to main runs the tests, so main always shows the suite on what
      # landed.
      - name: Choose whether to run
        id: paths
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            run=true
            why="a push to main always runs the acceptance tests"
          else
            # A base git can't read fails the step: only an empty list means nothing was touched.
            changed=$(git diff --name-only "$SINCE...HEAD" -- apps packages supabase \
              tests/acceptance package.json pnpm-lock.yaml pnpm-workspace.yaml 'tsconfig*.json' \
              .github/workflows/ci.yml \
              .github/actions/setup .github/actions/supabase-stack .github/actions/supabase-cli)
            if [[ -n $changed ]]; then
              run=true
              why="the change touches what the acceptance tests cover"
            else
              run=false
              why="the change touches none of apps/, packages/, supabase/, tests/acceptance/, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, the root tsconfig*.json, ci.yml or the setup, supabase-stack and supabase-cli actions"
            fi
          fi
          if [[ $run == true ]]; then
            summary="Acceptance tests run: $why."
          else
            summary="Acceptance tests skipped, and the check passes: $why."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "$summary" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup
        if: steps.paths.outputs.run == 'true'
      - name: Start the Supabase stack
        if: steps.paths.outputs.run == 'true'
        uses: ./.github/actions/supabase-stack
      - name: Run the acceptance tests over HTTP
        if: steps.paths.outputs.run == 'true'
        run: pnpm test:acceptance --reporter=verbose

  # CONSTRAINTS.md, Determinism row (#48): the recorded script through packages/sim in two
  # processes, against the recorded state hash. No path filter: the hash covers every rules change.
  determinism:
    name: ci / determinism
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.draft != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm determinism

  # CONSTRAINTS.md, the two Boundaries rows (#41): .fallowrc.jsonc's zones, rules and forbidden
  # calls, over the whole project. ESLint's sim block in `ci / lint` holds the rest of the purity row.
  boundaries:
    name: ci / boundaries
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.draft != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm boundaries

  # CONSTRAINTS.md, "Sim speed" (#41): advance() 30 days and apply() per call against their budgets,
  # each the median of 5 runs after 3 warm-ups, with the one re-measure "Timing checks" allows. The
  # bench writes both medians as notices. No path filter: a required check must report on every PR.
  bench:
    name: ci / bench
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.draft != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm bench --reporter=github-actions

  # CONSTRAINTS.md, "Assertion strength (warn)" (#41): Stryker on the packages/sim source files this
  # change touches, and nothing when it touches none (the CI cost rule). A score under 60% is a
  # warning annotation the weekly retro reads; it never fails the job, and the job isn't required.
  # A stacked part is judged on its own diff, from the branch below it.
  mutation:
    name: ci / mutation
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.draft != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SINCE: >-
        ${{ github.event_name == 'push' && github.event.before || format('origin/{0}',
        github.base_ref) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the changed files are read from the merge base
      - uses: ./.github/actions/setup
      # Stryker's score: detected (killed or timed out) over valid (those plus survived and
      # uncovered) mutants. 60% is CONSTRAINTS.md's floor for the warning. The decision to mutate
      # is in the script, not an `if:`, so the step always runs (the floor guard's check-removed).
      - name: Mutate the changed packages/sim source files
        run: |
          # A ref git can't read fails the step here; only grep's "no match" is allowed.
          changed=$(git diff --name-only --diff-filter=AMR "$SINCE...HEAD" -- 'packages/sim/src/*.ts')
          files=$( (grep -v -e '/tests/' -e '\.test\.ts$' <<<"$changed" || true) | paste -sd, -)
          if [[ -z $files ]]; then
            echo "No packages/sim source file changed: nothing to mutate."
            exit 0
          fi
          echo "Mutating: $files"
          pnpm mutation --mutate "$files"
          score=$(jq -r '[.files[].mutants[].status] as $s
            | ($s | map(select(. == "Killed" or . == "Timeout")) | length) as $detected
            | ($s | map(select(. == "Killed" or . == "Timeout" or . == "Survived" or . == "NoCoverage")) | length) as $valid
            | if $valid == 0 then "none" else ($detected * 1000 / $valid | floor) / 10 end' \
            reports/mutation/mutation.json)
          echo "Mutation score on the changed packages/sim files: $score%" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ $score != none ]] && awk -v s="$score" 'BEGIN { exit !(s < 60) }'; then
            echo "::warning title=ci / mutation::Mutation score $score% on the changed packages/sim files is under 60% (CONSTRAINTS.md, Assertion strength). The survivors are in this step's log."
          fi

  # #255: the shell scripts' test suites, every *.test.sh under scripts/ and .claude/hooks/, found
  # by the runner so a new suite needs no edit here. Each suite fakes gh on PATH and needs no secret:
  # the job holds no token, persists no credentials, and the runner puts a gh that refuses every
  # call ahead of the real one. The setup step fits the runner to the suites' headers.
  scripts:
    name: ci / scripts
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.draft != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zsh: issue-fields.test.sh calls the script from zsh, and the ubuntu-24.04 image has none.
      # The identity is a fallback for a suite that forgets its own; today each sets one (git -c,
      # or GIT_CONFIG_GLOBAL), which wins over this. bash, jq, git 2.36+ and GNU date are on the
      # image: the versions print below.
      - name: Set up the runner for the suites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          command -v zsh >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends zsh >/dev/null
          }
          git config --global user.name "ci / scripts"
          git config --global user.email "ci-scripts@example.invalid"
          bash --version | head -n1; jq --version; git --version; date --version | head -n1
          zsh --version
      - name: Run the suites
        env:
          TMPDIR: ${{ runner.temp }} # unset on the image; the suites build throwaway repos under it
        run: bash .github/scripts/shell-suites.sh

  floor:
    name: guard / floor
    # A PR guard: on every part of a stack, never on main after a merge, and not on a draft.
    needs: gate
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.gate.outputs.draft != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # The stack's base, or the default branch, never the part below (ADR-0002, area 2,
      # "Stacks"): the guard always comes from main, never from a lower part's branch, and judges
      # the whole stack below this part, so an Exceptions row in a lower part covers those above.
      BASE_REF: ${{ github.event.pull_request.stack.base.ref || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the guard diffs against the merge base
      # Node from a pinned action, and pnpm through Corepack. A local action such as
      # ./.github/actions/setup is read from the PR's checkout, so a PR could change what runs here
      # before the base branch's guard starts (#99).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Run the base branch's guard, not the PR's, so a PR can't weaken the guard that judges it.
      # It runs with its own dependencies, from the base branch too (#132: a Markdown parser): a
      # worktree of the base outside the checkout, installed from the base's lockfile with every
      # install script off. A PR can't swap what the guard imports, and the guard's diff of the
      # checkout doesn't see the install. The PR's own copy is used only while the base has no guard
      # yet (the PR that adds it).
      - name: Take the guard from the base branch
        run: |
          ref="origin/$BASE_REF"
          if ! git cat-file -e "$ref:.github/scripts/floor-guard.mjs" 2>/dev/null; then
            ref=HEAD
            echo "::warning::origin/$BASE_REF has no floor guard yet; using this PR's copy"
          fi
          git worktree add --detach "$RUNNER_TEMP/floor-guard" "$ref"
          echo "Using the floor guard from $ref"
      - name: Install the guard's dependencies from the base branch
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          cd "$RUNNER_TEMP/floor-guard"
          pnpm install --frozen-lockfile --ignore-scripts
      - run: node "$RUNNER_TEMP/floor-guard/.github/scripts/floor-guard.mjs" --base "origin/$BASE_REF"
