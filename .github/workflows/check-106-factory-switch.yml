# THROWAWAY: #106 criterion 3, a run with the factory's kill switch off. Delete this file once its
# runs are recorded on #106. scripts/setup/factory-switch.sh dispatches it on main;
# workflow_dispatch needs actions: write, which the admin's gh has and a lane's token lacks
# (open-pr.yml's header), so only the admin can start it. It reads no inputs.
# It calls the switch exactly as #107 and #108 will (factory-switch.yml's header), then a stand-in
# for their factory work: with FACTORY_ENABLED anything but `true` the switch logs a SWITCH off line
# and the stand-in is skipped. The stand-in itself mints no token and calls no Claude, so the run
# is harmless with the switch on too.
name: check-106-factory-switch

on:
  workflow_dispatch:

permissions: {}

jobs:
  switch:
    uses: ./.github/workflows/factory-switch.yml
    permissions:
      contents: read

  stand-in:
    needs: switch
    if: needs.switch.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: |
          echo "RESULT stand-in ran: the switch was on, so a factory job would mint its token here"
