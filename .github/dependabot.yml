version: 2
updates:
  - package-ecosystem: npm            # pnpm uses the npm ecosystem
    directory: /
    schedule: { interval: weekly }
    versioning-strategy: increase     # exact pins stay exact
    cooldown:
      default-days: 7                 # matches minimumReleaseAge in pnpm-workspace.yaml
    groups:
      all-dev:
        dependency-type: development
    ignore:                           # TypeScript majors are upgraded by hand, not by Dependabot (#268)
      - dependency-name: typescript   # the TS 6 API, aliased to @typescript/typescript6 for typescript-eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript-7 # the compiler (tsc), aliased to typescript 7
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript/typescript6"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3
    labels: ["area:ci-cd", "review:admin"]          # code-owned paths (triage-labels.md)
    commit-message: { prefix: chore, include: scope } # chore(deps): / chore(deps-dev):
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
    labels: ["area:ci-cd", "review:admin"]
    commit-message: { prefix: chore, include: scope }
