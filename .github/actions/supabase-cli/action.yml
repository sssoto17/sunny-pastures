name: supabase-cli
description: >-
  The Supabase CLI from its GitHub release, checked against a hash written here, on the PATH (#51).
  The one place CI pins the CLI: the supabase-stack action (the local stack for tests) and the
  staging workflow (`supabase db push` to hosted staging) both use it, and
  .devcontainer/post-create.sh reads the same pins. Needs no pnpm, so a job with a sparse checkout
  can use it. linux amd64 only: that is the only hash pinned.
runs:
  using: composite
  steps:
    # The standalone binary, as supabase/README.md requires, at the version `pnpm supabase:check`
    # pins. v2.122.0 was published on 23 Oct 2026, past the 7-day rule for binaries
    # (CONSTRAINTS.md, "Tools are dependencies"). The hash is the release's own checksums.txt line,
    # copied here so a replaced release asset fails the step (as security.yml does for gitleaks).
    # No third-party action (supabase/setup-cli installs from npm with no hash check; admin, 26 Nov
    # 2026, on #51). .devcontainer/post-create.sh reads SUPABASE_VERSION and SUPABASE_SHA256 from
    # this file, one `KEY: value` line each, so keep them in that shape (#501).
    - name: Install the Supabase CLI
      shell: bash
      env:
        SUPABASE_VERSION: 2.122.0
        SUPABASE_SHA256: 59ed066847b98d7461c60e9109d40cab6b9756177ce06ebb05b51338519f5136
      run: |
        dir="$RUNNER_TEMP/supabase-cli"
        archive="supabase_${SUPABASE_VERSION}_linux_amd64.tar.gz"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/$archive" \
          "https://github.com/supabase/cli/releases/download/v${SUPABASE_VERSION}/$archive"
        echo "$SUPABASE_SHA256  $dir/$archive" | sha256sum --check --strict
        tar -xzf "$dir/$archive" -C "$dir" supabase
        version=$("$dir/supabase" --version)
        if [[ $version != "$SUPABASE_VERSION" ]]; then
          echo "::error title=Wrong Supabase CLI::expected $SUPABASE_VERSION, got $version"
          exit 1
        fi
        echo "Supabase CLI $version installed."
        echo "$dir" >> "$GITHUB_PATH"
