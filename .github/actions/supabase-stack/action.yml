name: supabase-stack
description: >-
  The local Supabase stack for tests (#382; ADR-0007 section 6), reusable by any job that needs
  one (#49's ci / acceptance): the Supabase CLI from the supabase-cli action (its release, checked
  against a hash written there), then pnpm db:start, pnpm db:reset and pnpm db:env, which leave
  DATABASE_URL, ADMIN_DATABASE_URL, SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in ./.env. Run
  ./.github/actions/setup first. No step prints a key, token or URL (#382; docs/agents/sandbox.md,
  "Secrets in output"): supabase/db.sh captures both of the CLI's streams and hides every value.
inputs:
  exclude:
    description: >-
      The services supabase start leaves out (its --exclude). The db tests need Postgres, and the
      auth module's tests need Auth (gotrue) behind the API gateway (kong); the rest only cost
      image pulls.
    default: realtime,storage-api,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
runs:
  using: composite
  steps:
    # The CLI, checked against its pinned hash, from the one action that pins it (#51).
    - uses: ./.github/actions/supabase-cli
    - name: Check the Supabase CLI's version
      shell: bash
      run: pnpm supabase:check
    # db:start lists the stack's URLs (password hidden) on stdout; #382 asks for no URL in the log,
    # so stdout is dropped. A failure still shows the CLI's output, redacted, on stderr.
    - name: Start the stack
      shell: bash
      env:
        EXCLUDE: ${{ inputs.exclude }}
      run: |
        pnpm db:start --exclude "$EXCLUDE" > /dev/null
        echo "The Supabase stack is up (excluded: $EXCLUDE)."
    - name: Reset the database
      shell: bash
      run: pnpm db:reset
    # Prints the variables' names only.
    - name: Write .env
      shell: bash
      run: pnpm db:env
