packages:
  - apps/*
  - packages/*

# Refuse versions published less than 7 days ago (minutes), so a hijacked release has time to be caught.
minimumReleaseAge: 10080

# Advisories `pnpm audit` skips (`ci / audit`).
auditConfig:
  ignoreGhsas:
    # picomatch ReDoS with no patched version; see CONSTRAINTS.md, Exceptions row E9 (#368).
    - GHSA-fc5q-39xc-vjpf
